<!doctype html><meta name="viewport" content="width=device-width"><title>WorldPulse</title><style>body{font-family:Arial;background:#f4f7fb;padding:20px}main{max-width:900px;margin:auto}.box{background:white;padding:18px;border-radius:14px;margin:12px 0}input,select,button{padding:10px;margin:4px}article{border-bottom:1px solid #ddd;padding:10px}a{color:#16c}</style><main><div class="box"><h1>🌍 WorldPulse News</h1><input id="q" placeholder="Search"><select id="c"><option value="">Worldwide</option><option value="in">India</option><option value="us">USA</option><option value="gb">UK</option><option value="jp">Japan</option><option value="au">Australia</option><option value="ca">Canada</option></select><select id="cat"><option value="">All</option><option>technology</option><option>business</option><option>sports</option><option>science</option><option>health</option></select><button onclick="load()">Refresh</button><span id="timer">Auto-refresh: 30s</span></div><div id="out" class="box">Loading...</div></main><script>
const e=s=>String(s||'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const REFRESH_SECONDS=30;
let countdown=REFRESH_SECONDS;
let refreshBusy=false;
async function load(){
  if(refreshBusy) return;
  refreshBusy=true;
  countdown=REFRESH_SECONDS;
  document.querySelector('#timer').textContent='Refreshing…';
  const p=new URLSearchParams(), q=document.querySelector('#q').value, c=document.querySelector('#c').value, k=document.querySelector('#cat').value;
  if(q)p.set('q',q); if(c)p.set('country',c); if(k)p.set('category',k);
  try{
    const r=await fetch('/news?'+p,{cache:'no-store',headers:{'Cache-Control':'no-cache'}});
    const d=await r.json();
    document.querySelector('#out').innerHTML=(d.articles||[]).map(a=>`<article><h3>${e(a.title)}</h3><p>${e(a.description)}</p><small>Published: ${e(a.pubDate)}</small><br><a target="_blank" rel="noopener" href="${e(a.link||'#')}">Read source</a></article>`).join('')||'No news';
  }catch(err){document.querySelector('#out').textContent='News refresh failed. Retrying in 30 seconds…';}
  finally { refreshBusy=false; }
  document.querySelector('#timer').textContent='Auto-refresh: 30s';
}
setInterval(()=>{countdown--;document.querySelector('#timer').textContent=`Auto-refresh: ${Math.max(countdown,0)}s`;if(countdown<=0){countdown=REFRESH_SECONDS;load();}},1000);
load();
</script>
