<!doctype html><meta name="viewport" content="width=device-width"><title>Admin</title><style>body{font-family:Arial;background:#f4f7fb;padding:20px}.box{max-width:650px;margin:auto;background:white;padding:20px;border-radius:14px}input,button{padding:10px}</style><div class="box"><h1>🔐 Admin Panel</h1><input id="k" type="password" placeholder="ADMIN_KEY"><button onclick="go()">View stats</button><pre id="o"></pre></div><script>async function go(){let r=await fetch('/admin/stats?key='+encodeURIComponent(k.value));o.textContent=JSON.stringify(await r.json(),null,2)}</script>
